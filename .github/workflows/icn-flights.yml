name: icn-flights
# 인천공항 출발 현황을 30분마다 받아 대시보드 data/flights.json 을 갱신한다.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: icn-flights
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 운항 현황 받기
        env:
          ICN_KEY: ${{ secrets.AIRPLANE }}
        run: python .github/scripts/icn_flights.py
      - name: 바뀌었으면 커밋
        run: |
          git config user.name "NanaTraveler"
          git config user.email "nanatraveler@users.noreply.github.com"
          git add travel/dashboards/icn-airlines/data/flights.json
          git diff --cached --quiet && exit 0
          git commit -qm "인천공항 운항 현황 갱신"
          git pull -q --rebase origin main
          git push -q
