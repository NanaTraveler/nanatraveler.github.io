name: pages
# 사이트 게시. Settings → Pages → Source 를 "GitHub Actions" 로 두면 이 워크플로가 게시한다.
# 운항 현황 갱신(icn-flights)이 끝나면 따라서 다시 게시한다.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [icn-flights]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
